spring.application.name=dispositivos-service
server.port=8082

# Base de datos MySQL propia de este microservicio (una base por servicio).
# Se crea sola si no existe. Usuario y clave se leen de variables de entorno: no se escriben en el repositorio.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tiotec_dispositivos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

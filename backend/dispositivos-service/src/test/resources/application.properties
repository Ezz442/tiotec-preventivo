# Las pruebas usan H2 en memoria: no necesitan MySQL. Este archivo reemplaza al de main durante los tests.
spring.application.name=dispositivos-service
spring.datasource.url=jdbc:h2:mem:dispositivos-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
